<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARVO Admin | NEOCRAFT LLP</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--green:#087b4b;--dark:#0b2520;--bg:#f4f7f6;--muted:#70817a;--line:#e4ebe7}*{box-sizing:border-box}body{margin:0;font-family:DM Sans,Arial,sans-serif;background:var(--bg);color:#182b25}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:247px 1fr;min-height:100vh}.sidebar{background:#092b21;color:white;padding:26px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-family:Manrope,sans-serif;font-size:28px;letter-spacing:-1.7px;font-weight:800;padding:4px 13px 28px}.brand span{color:#2cdb8c}.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:700;color:#9ec4b1;margin-top:-2px}.slabel{padding:21px 13px 9px;color:#79a492;font-size:10px;font-weight:800;letter-spacing:1.6px}.nav{display:flex;width:100%;padding:12px 13px;gap:12px;align-items:center;background:none;border:none;text-align:left;color:#bfd8ca;border-radius:10px;font-weight:650;margin:2px 0}.nav:hover,.nav.active{background:#185a42;color:white}.nav .ico{font-size:17px;width:22px;text-align:center}.sidefooter{margin-top:34px;border-top:1px solid #205340;padding:18px 12px;color:#9fc4b3;font-size:12px;line-height:1.7}.main{min-width:0}.topbar{height:77px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 31px;border-bottom:1px solid var(--line);gap:12px}.bread{font-size:13px;color:var(--muted)}.bread strong{display:block;font-size:20px;color:var(--dark);margin-top:2px}.avatar{height:36px;width:36px;border-radius:50%;background:#dcf5e7;display:grid;place-items:center;color:#087b4b;font-weight:800}.topright{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.work{max-width:1550px;margin:0 auto;padding:28px 30px 70px}.banner{background:linear-gradient(115deg,#0b553c,#0f8060);border-radius:18px;padding:23px 26px;color:white;display:flex;align-items:center;justify-content:space-between;gap:18px}.banner h2{margin:0 0 7px;font-size:23px}.banner p{margin:0;color:#d3efe0;font-size:13px;line-height:1.5}.chip{font-size:11px;padding:6px 9px;border-radius:6px;background:#e6f5ec;color:#127145;font-weight:800;white-space:nowrap}.chip.amber{background:#fff4db;color:#906000}.chip.blue{background:#e8f1ff;color:#225db0}.chip.gray{background:#edf2ef;color:#5d6d65}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:21px}.stat .num{font-size:30px;font-weight:800;margin:13px 0 4px}.stat .lab{color:#60766c;font-size:12px;font-weight:700}.stat .sub{color:#94a49a;font-size:11px;margin-top:6px}.sectiontop{display:flex;justify-content:space-between;align-items:center;margin:23px 0 13px;gap:12px}.sectiontop h2{font-size:19px;margin:0;letter-spacing:-.5px}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #dbe7df;border-radius:9px;padding:10px 14px;background:white;color:#244336;font-weight:750;font-size:12px}.btn.primary{background:#0b754c;border-color:#0b754c;color:white}.btn:hover{filter:brightness(.96)}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line);gap:9px}.toolbar input,.toolbar select{border:1px solid #dce7df;border-radius:9px;padding:10px 12px;background:#fff;color:#334b3e;min-width:160px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:14px 16px;border-bottom:1px solid #eef2ef;font-size:12px}th{color:#7a8b81;font-weight:800;background:#fcfdfc}td{color:#2c4639}tr:last-child td{border:0}tr:hover td{background:#fcfefd}.strong{font-weight:800}.muted{color:#85978a}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:17px}.paneltitle{padding:20px 20px 6px;font-size:16px;font-weight:800}.activity{padding:12px 20px 20px}.activityitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #edf3ee}.activityitem:last-child{border:0}.dot{height:9px;width:9px;margin-top:5px;background:#15ab70;border-radius:50%;flex-shrink:0}.activityitem b{font-size:12px}.activityitem p{font-size:12px;color:#7b8f81;margin:4px 0}.bar{background:#e9f3ed;height:10px;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:#15aa6a;border-radius:10px}.catline{padding:13px 20px}.catline .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:750}.field input,.field select,.field textarea{border:1px solid #d8e5dc;border-radius:9px;padding:11px;background:white;min-width:0;outline-color:#17a96a}.field.full{grid-column:1/-1}.field textarea{min-height:94px;resize:vertical}.modalwrap{position:fixed;inset:0;background:#071c16a8;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(610px,100%);background:white;box-shadow:0 30px 90px #0003;border-radius:18px;padding:24px;max-height:91vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:20px}.x{border:0;background:#f0f4f1;border-radius:8px;padding:7px 10px;font-size:17px}.modbuttons{display:flex;gap:10px;justify-content:flex-end;margin-top:19px}.empty{padding:38px;text-align:center;color:#73877a}.notice{background:#fffaf0;border:1px solid #f0e5c3;border-radius:10px;padding:13px 17px;color:#7a622a;font-size:12px;margin-top:13px;line-height:1.5}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.smallcard{padding:17px;background:white;border:1px solid var(--line);border-radius:13px}.smallcard h3{margin:8px 0;font-size:14px}.smallcard p{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#102c22;color:white;border-radius:11px;padding:12px 18px;z-index:40;box-shadow:0 8px 30px #0003;font-size:13px}.hint{font-size:12px;color:#789083;line-height:1.6}.hidden{display:none!important}@media(max-width:950px){.app{grid-template-columns:72px 1fr}.brand{font-size:18px;padding:4px 1px 18px}.brand small,.nav .txt,.slabel,.sidefooter{display:none}.sidebar{padding:17px 10px}.nav{justify-content:center;padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.work{padding:20px}.topbar{padding:0 20px}}@media(max-width:540px){.stats,.gridcards,.formgrid{grid-template-columns:1fr}.topright span{display:none}.topbar{height:67px}.work{padding:13px}.banner{padding:18px;display:block}.sectiontop{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch}.toolbar input{width:100%}.field.full{grid-column:auto}}
</style><style>body:not(.admin-ready) .app{display:none}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#08291f,#f4f7f6 62%)}body.admin-ready .auth-screen{display:none}.auth-card{width:min(420px,100%);background:white;border:1px solid #dce8e1;border-radius:18px;padding:28px;box-shadow:0 24px 70px #001b1230}.auth-card h1{margin:8px 0 8px;font-size:28px;color:#0b2520}.auth-card p{margin:0 0 20px;color:#6b7b72;line-height:1.55}.auth-card input{width:100%;border:1px solid #ccd9d2;border-radius:10px;padding:13px;margin-bottom:13px}.auth-error{color:#a33b2f;font-size:12px;min-height:18px;margin-top:10px}.logoutbtn{border:1px solid #dbe7df;border-radius:9px;padding:8px 11px;background:white;color:#244336;font-weight:750;font-size:12px}</style></head><body><div class="auth-screen"><form class="auth-card" onsubmit="adminLogin(event)"><div class="brand" style="padding:0;color:#0b2520">KAR<span>VO</span>.</div><h1>Admin Login</h1><p>Enter the KARVO admin password to open live orders and operations.</p><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password" required><button id="adminLoginBtn" class="btn primary" style="width:100%;font-size:14px" type="submit">Login</button><div id="authError" class="auth-error"></div></form></div><div class="app"><aside class="sidebar"><div class="brand">KAR<span>VO</span>.<small>ADMIN CONSOLE</small></div><div class="slabel">WORKSPACE</div><div id="menu"></div><div class="sidefooter">KARVO Live Operations<br><b>Production Console</b><br>Orders sync from the live website.</div></aside><div class="main"><header class="topbar"><div class="bread">KARVO / ADMIN <strong id="heading">Overview</strong></div><div class="topright"><span>Jaipur, Rajasthan</span><span class="chip">LIVE</span><button class="logoutbtn" onclick="adminLogout()">Logout</button><div class="avatar">K</div></div></header><div class="work" id="view"></div></div></div><div id="portal"></div><script>
const storage='karvo_admin_live_v1';
const seeds={enquiries:[],jobs:[],staff:[],bookings:[],services:[],categories:['Fabrication','Interiors','Industrial Works','Renovation','Maintenance','Electrical','Plumbing','Painting','Roofing & Cladding','Flooring & Tiles','Glass & Aluminium','Signage & Branding','Carpentry & Furniture','Landscape & Outdoor','Hire Professionals & Labour'],settings:{company:'KARVO',location:'Jaipur, Rajasthan',phone:'+91 91666 91274',email:'karvosite@gmail.com',currency:'INR'}};
function clone(x){return JSON.parse(JSON.stringify(x))}let db;try{db=JSON.parse(localStorage.getItem(storage))||clone(seeds)}catch{db=clone(seeds)}for(const k of Object.keys(seeds))if(!(k in db))db[k]=clone(seeds[k]);
let section='orders',filter='';function save(){localStorage.setItem(storage,JSON.stringify(db))}function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),2400)}const pages=[['overview','▦','Overview'],['orders','▣','Live Orders'],['enquiries','✉','Enquiries & Leads'],['jobs','▤','Projects & Tasks'],['bookings','▣','Hiring Bookings'],['staff','♙','Team & Labour'],['services','▧','Services & Pricing'],['categories','◫','Categories'],['reports','▥','Reports & Export'],['settings','⚙','Settings']];
function authError(msg){const x=document.getElementById('authError');if(x)x.textContent=msg||''}async function checkAdminSession(){try{const r=await fetch('/api/admin-auth',{cache:'no-store'});const data=await r.json();if(data.loggedIn){document.body.classList.add('admin-ready');initMenu();render();return}authError(data.configured?'':'Admin password is not configured in Vercel.')}catch{authError('Could not check admin login.')}}async function adminLogin(event){event.preventDefault();authError('');const btn=document.getElementById('adminLoginBtn');const password=document.getElementById('adminPassword')?.value||'';if(btn){btn.disabled=true;btn.textContent='Checking...'}try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');document.body.classList.add('admin-ready');initMenu();render();toast('Admin login successful')}catch(err){authError(err.message||'Login failed')}finally{if(btn){btn.disabled=false;btn.textContent='Login'}}}async function adminLogout(){await fetch('/api/admin-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'logout'})}).catch(()=>{});document.body.classList.remove('admin-ready');authError('');document.getElementById('adminPassword').value=''}
function initMenu(){document.getElementById('menu').innerHTML=pages.map(([id,ico,label],i)=>`${i===7?'<div class="slabel">SYSTEM</div>':''}<button class="nav ${section===id?'active':''}" onclick="switchTo('${id}')"><span class="ico">${ico}</span><span class="txt">${label}</span></button>`).join('')};function switchTo(s){section=s;filter='';initMenu();render();window.scrollTo(0,0)}function actions(name,kind){return `<div class="tools"><button class="btn" onclick="exportCSV('${kind}')">↓ Export CSV</button><button class="btn primary" onclick="editRow('${kind}')">+ ${name}</button></div>`}function badge(v){let c=/new|requested|planning|pending/i.test(v)?'amber':/progress|contacted|assigned/i.test(v)?'blue':/completed|won|available|approved/i.test(v)?'':'gray';return `<span class="chip ${c}">${esc(v)}</span>`}function table(kind,cols,rows){return `<div class="panel"><div class="toolbar"><div class="strong" style="font-size:13px">${rows.length} records</div><input placeholder="Search ${kind}..." value="${esc(filter)}" oninput="filter=this.value;drawTable('${kind}')" id="flt"></div><div class="tablewrap" id="tbl">${tableInner(kind,cols,rows)}</div></div>`}function tableInner(kind,cols,rows){let out=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()));return out.length?`<table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${out.map(r=>`<tr>${cols.map(([k])=>`<td>${k==='status'||k==='availability'?badge(r[k]):k==='price'||k==='rate'||k==='value'||k==='visitFee'?money(r[k]??(k==='visitFee'?299:0)):k==='enabled'?badge(r[k]?'Active':'Hidden'):esc(r[k])}</td>`).join('')}<td><button class="btn" onclick="editRow('${kind}','${r.id}')">Edit</button> <button class="btn" onclick="deleteRow('${kind}','${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No matching records found.</div>`}const fields={enquiries:[['customer','Customer name','text'],['phone','Phone number','tel'],['service','Service required','text'],['location','Site location','text'],['budget','Budget / value','text'],['visitFee','Site visit charge (₹)','number'],['paymentStatus','Payment status','select','Payment Pending|Payment Link Sent|Paid (verified)|Waived|Refunded'],['paymentReference','Gateway transaction reference','text'],['date','Enquiry date','date'],['status','Status','select','New|Contacted|Quoted|Won|Lost'],['notes','Notes','textarea']],jobs:[['title','Project title','text'],['client','Client','text'],['category','Category','text'],['value','Project value (₹)','number'],['progress','Progress (%)','number'],['start','Start date','date'],['deadline','Deadline','date'],['status','Status','select','Planning|In Progress|On Hold|Completed']],bookings:[['customer','Customer','text'],['role','Required role','text'],['staff','Assigned staff','text'],['date','Start date','date'],['workers','Workers','number'],['days','Days','number'],['status','Status','select','Requested|Contacted|Confirmed|In Progress|Completed|Cancelled']],staff:[['name','Full name','text'],['role','Role / profession','text'],['skill','Skill category','select','Professional|Skilled Labour|General Labour'],['rate','Daily client booking rate (₹)','number'],['availability','Availability','select','Available|Assigned|Unavailable'],['experience','Experience','text'],['phone','Contact number','tel'],['verified','Credentials checked?','select','No|Yes']],services:[['name','Service name','text'],['category','Category','text'],['price','Indicative starting rate (₹)','number'],['unit','Unit','select','sq.ft.|sq.m.|day|kg|visit|running ft.|project'],['enabled','Show in catalogue','checkbox']]};
function editRow(kind,id){let row=id?db[kind].find(x=>String(x.id)===id):{},isNew=!id;if(!row)return;let form=fields[kind].map(([key,label,type,opts])=>{let v=row[key]??(kind==='enquiries'&&key==='visitFee'?299:kind==='enquiries'&&key==='paymentStatus'?'Payment Pending':'');return `<label class="field ${key==='notes'?'full':''}">${label}${type==='textarea'?`<textarea name="${key}">${esc(v)}</textarea>`:type==='select'?`<select name="${key}">${opts.split('|').map(x=>`<option ${x===String(v)?'selected':''}>${esc(x)}</option>`).join('')}</select>`:type==='checkbox'?`<input name="${key}" type="checkbox" ${v?'checked':''}>`:`<input name="${key}" type="${type}" value="${esc(v)}" ${['customer','title','name'].includes(key)?'required':''}>`}</label>`}).join('');document.getElementById('portal').innerHTML=`<div class="modalwrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${isNew?'Add':'Edit'} ${kind.slice(0,-1)}</h2><button class="x" onclick="closeModal()">×</button></div><form id="editform" onsubmit="submitRow(event,'${kind}','${id||''}')"><div class="formgrid">${form}</div><div class="modbuttons"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></div>`}
function closeModal(ev){if(ev&&ev.target!==ev.currentTarget)return;document.getElementById('portal').innerHTML=''}function submitRow(event,kind,id){event.preventDefault();let f=event.target;let obj=id?db[kind].find(x=>String(x.id)===id):{id:(kind==='staff'?'STF-':kind==='enquiries'?'ENQ-':kind==='jobs'?'JOB-':kind==='bookings'?'BK-':'SVC-')+Date.now().toString().slice(-7)};for(let [key,label,type] of fields[kind]){let el=f.elements[key];obj[key]=type==='checkbox'?el.checked:type==='number'?Number(el.value):el.value}if(!id){if(kind==='enquiries'){obj.visitFee=299;obj.paymentStatus=obj.paymentStatus||'Payment Pending';}db[kind].unshift(obj);}save();closeModal();render();toast('Saved')}function deleteRow(kind,id){if(!confirm('Delete this record?'))return;db[kind]=db[kind].filter(x=>String(x.id)!==id);save();render();toast('Record deleted')};function drawTable(kind){let cols=columns[kind];document.getElementById('tbl').innerHTML=tableInner(kind,cols,db[kind])}const columns={enquiries:[['id','ID'],['customer','Customer'],['service','Service'],['location','Location'],['budget','Budget'],['visitFee','Visit fee'],['paymentStatus','Payment'],['status','Stage'],['date','Date']],jobs:[['id','Job ID'],['title','Project'],['client','Client'],['category','Type'],['value','Value'],['progress','Progress %'],['status','Status']],bookings:[['id','Booking ID'],['customer','Customer'],['role','Role'],['staff','Assigned to'],['date','Start'],['days','Days'],['workers','Workers'],['status','Status']],staff:[['name','Team member'],['role','Role'],['skill','Type'],['rate','Booking/day'],['availability','Availability'],['experience','Experience'],['verified','Verified']],services:[['name','Service'],['category','Category'],['price','From'],['unit','Unit'],['enabled','Visibility']]};
function overview(){setTimeout(loadOrders,0);let live=liveOrders.length, active=db.jobs.filter(x=>x.status==='In Progress').length,booked=db.bookings.filter(x=>x.status==='Requested').length,staff=db.staff.filter(x=>x.availability==='Available').length;return `<div class="banner"><div><h2>Good afternoon 👋</h2><p>Manage KARVO live orders, enquiries, projects and team deployments from one place.</p></div><span class="chip">Live operations</span></div><div class="stats">${[['Live orders',`<span id="overviewOrderCount">${live}</span>`,'Synced from checkout'],['Active projects',active,'Execution status'],['Hiring requests',booked,'Pending confirmation'],['Available staff',staff,'Team availability']].map(([lab,num,sub])=>`<div class="stat"><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub}</div></div>`).join('')}</div><div class="sectiontop"><h2>Operations snapshot</h2><button class="btn primary" onclick="switchTo('orders')">Manage live orders →</button></div><div class="two"><div class="panel"><div class="paneltitle">Latest live orders</div><div id="overviewOrdersMount"><div class="empty">Loading live orders...</div></div></div><div class="panel"><div class="paneltitle">Project progress</div>${db.jobs.map(x=>`<div class="catline"><div class="row"><b>${esc(x.title)}</b><span>${x.progress}%</span></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,x.progress))}%"></i></div></div>`).join('')||'<div class="empty">No projects yet</div>'}</div></div>`}
function categoryPage(){return `<div class="sectiontop"><h2>Service categories</h2><div class="tools"><button class="btn primary" onclick="addCategory()">+ Add category</button></div></div><div class="gridcards">${db.categories.map((c,i)=>`<div class="smallcard"><span class="chip gray">CATEGORY ${i+1}</span><h3>${esc(c)}</h3><p>${db.services.filter(s=>s.category===c).length} managed service entries</p><button class="btn" onclick="renameCategory(${i})">Rename</button> <button class="btn" onclick="removeCategory(${i})">Delete</button></div>`).join('')}</div>`}function addCategory(){let v=prompt('Category name');if(!v)return;if(db.categories.some(x=>x.toLowerCase()===v.trim().toLowerCase()))return toast('Category already exists');db.categories.push(v.trim());save();render()}function renameCategory(i){let v=prompt('New category name',db.categories[i]);if(!v)return;let old=db.categories[i];db.categories[i]=v.trim();db.services.forEach(x=>{if(x.category===old)x.category=v.trim()});save();render()}function removeCategory(i){if(!confirm('Remove this category from admin?'))return;db.categories.splice(i,1);save();render()}
function reports(){return `<div class="sectiontop"><h2>Reports, backup & restore</h2></div><div class="gridcards">${[['Enquiries','enquiries'],['Projects','jobs'],['Hiring bookings','bookings'],['Team directory','staff'],['Service price list','services']].map(([name,id])=>`<div class="smallcard"><span class="chip">CSV EXPORT</span><h3>${name}</h3><p>${db[id].length} records</p><button class="btn primary" onclick="exportCSV('${id}')">Download CSV</button></div>`).join('')}</div><div class="panel" style="margin-top:18px;padding:20px"><h3>Full data backup</h3><p class="hint">Download a JSON backup of your admin records, or restore a previous backup. Use this to export current admin records.</p><div class="tools"><button class="btn primary" onclick="exportJSON()">Download JSON backup</button><label class="btn">Import JSON backup <input class="hidden" type="file" accept=".json,application/json" onchange="importJSON(event)"></label><button class="btn" onclick="resetData()">Reset records</button></div></div>`}function exportCSV(kind){let a=db[kind],keys=[...new Set(a.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...a.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download(kind+'.csv',csv,'text/csv;charset=utf-8')}function download(name,contents,type){let blob=new Blob(['\ufeff',contents],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportJSON(){download('karvo-admin-backup.json',JSON.stringify(db,null,2),'application/json')}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.enquiries)||!Array.isArray(obj.staff)||!Array.isArray(obj.services))throw Error('Unrecognized backup file');if(!confirm('Replace current admin records with imported backup?'))return;db=obj;save();render();toast('Backup restored')}catch(err){alert('Could not import backup: '+err.message)}}function resetData(){if(!confirm('Reset all admin records?'))return;db=clone(seeds);save();render();toast('Records reset')}
let liveOrders=[];let liveOrdersMeta={storage:'loading',setupRequired:false};async function loadOrders(){const out=document.getElementById('liveOrdersMount');if(out)out.innerHTML='<div class="empty">Loading live orders...</div>';try{const r=await fetch('/api/orders',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to load orders');liveOrders=data.orders||[];liveOrdersMeta=data;renderOrdersTable();renderOverviewOrders()}catch(err){if(out)out.innerHTML='<div class="notice"><b>Orders could not load.</b><br>'+esc(err.message)+'</div>';const ov=document.getElementById('overviewOrdersMount');if(ov)ov.innerHTML='<div class="notice"><b>Orders could not load.</b><br>'+esc(err.message)+'</div>'}}function orderStatus(o){const n=o.notificationResults||{};if(n.sms===false||n.email===false||n.error)return 'Attention';if(n.email)return 'Mail sent';if(n.sms)return 'SMS sent';return 'Saved'}function storageLabel(){return liveOrdersMeta.storage==='vercel-blob'?'Permanent storage':'Live server'}function orderRows(){return liveOrders.map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><span class="muted">'+esc(o.created||o.createdAt||'')+'</span></td><td>'+esc(o.name)+'<br><span class="muted">'+esc(o.phone||'')+'</span></td><td>'+esc((o.items||[]).slice(0,2).join(', '))+'</td><td>'+money(o.orderTotal||0)+'</td><td>'+badge(orderStatus(o))+'</td><td><button class="btn" onclick="viewLiveOrder(&quot;'+esc(o.id)+'&quot;)">View</button></td></tr>').join('')||'<tr><td colspan="6"><div class="empty">No live orders yet. Place a customer order and it will appear here.</div></td></tr>'}function renderOverviewOrders(){const count=document.getElementById('overviewOrderCount');if(count)count.textContent=liveOrders.length;const out=document.getElementById('overviewOrdersMount');if(!out)return;out.innerHTML=liveOrders.length?'<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th></th></tr></thead><tbody>'+liveOrders.slice(0,5).map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><span class="muted">'+esc(o.created||o.createdAt||'')+'</span></td><td>'+esc(o.name)+'<br><span class="muted">'+esc(o.phone||'')+'</span></td><td>'+money(o.orderTotal||0)+'</td><td><button class="btn" onclick="viewLiveOrder(&quot;'+esc(o.id)+'&quot;)">View</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No live orders yet. Place a customer order and it will appear here.</div>'}function renderOrdersTable(){const out=document.getElementById('liveOrdersMount');if(!out)return;out.innerHTML='<div class="panel"><div class="toolbar"><div class="strong">'+liveOrders.length+' live orders <span class="muted">• '+esc(storageLabel())+'</span></div><button class="btn" onclick="loadOrders()">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Notify</th><th>Actions</th></tr></thead><tbody>'+orderRows()+'</tbody></table></div></div>'+(liveOrdersMeta.setupRequired?'<div class="notice"><b>Permanent storage setup needed:</b> live orders are active, but permanent history needs <b>BLOB_READ_WRITE_TOKEN</b> in Vercel.</div>':'')}function liveOrdersPage(){setTimeout(loadOrders,0);return '<div class="sectiontop"><h2>Live customer orders</h2><div class="tools"><button class="btn primary" onclick="loadOrders()">Refresh Orders</button></div></div><div id="liveOrdersMount"><div class="empty">Loading live orders...</div></div><div class="notice">Orders appear here from the live customer checkout. Order and booking updates are sent by email only. SMS is used only for OTP verification.</div>'}function viewLiveOrder(id){const o=liveOrders.find(x=>x.id===id);if(!o)return;const n=o.notificationResults||{};document.getElementById('portal').innerHTML='<div class="modalwrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>'+esc(o.id)+'</h2><button class="x" onclick="closeModal()">×</button></div><p><b>Customer:</b> '+esc(o.name)+'<br><b>Phone:</b> '+esc(o.phone)+'<br><b>Email:</b> '+esc(o.email||'-')+'<br><b>Address:</b> '+esc(o.address||o.city||'-')+'</p><p><b>Total:</b> '+money(o.orderTotal||0)+' · <b>Delivery:</b> '+money(o.deliveryFee||0)+'<br><b>Payment:</b> '+esc(o.paymentMethod||'')+' / '+esc(o.paymentStatus||'')+'</p><h3>Items</h3><div class="notice" style="background:#f8fbf9;color:#294338;border-color:#dfeae4">'+esc((o.items||[]).join('\\n')).replace(/\\n/g,'<br>')+'</div><h3>Notification status</h3><pre style="white-space:pre-wrap;background:#f5f7f6;border:1px solid #dfe8e2;border-radius:10px;padding:12px;font-size:12px;overflow:auto">'+esc(JSON.stringify(n,null,2))+'</pre></div></div>'}
function settingsPage(){return `<div class="sectiontop"><h2>Business settings</h2></div><div class="panel" style="padding:23px;max-width:760px"><form onsubmit="saveSettings(event)"><div class="formgrid">${[['company','Company name'],['location','Primary service city'],['phone','Business phone'],['email','Business email']].map(([k,l])=>`<label class="field">${l}<input name="${k}" value="${esc(db.settings[k])}"></label>`).join('')}</div><div style="margin-top:18px"><button class="btn primary">Save settings</button></div></form></div><div class="notice"><b>Site visit policy:</b> ₹299 mandatory per visit request. Admin can mark payment paid only after external transaction verification. Payment verification is handled through the active checkout/payment setup.</div><div class="notice">Keep admin access private. For permanent order history, configure Vercel Blob storage in production.</div>`}function saveSettings(e){e.preventDefault();for(let k of ['company','location','phone','email'])db.settings[k]=e.target.elements[k].value;save();toast('Settings saved')}
function render(){document.getElementById('heading').textContent=pages.find(x=>x[0]===section)?.[2]||'Overview';const out=document.getElementById('view');if(section==='overview')out.innerHTML=overview();else if(section==='orders')out.innerHTML=liveOrdersPage();else if(columns[section])out.innerHTML=`<div class="sectiontop"><h2>${pages.find(x=>x[0]===section)[2]}</h2>${actions(section==='staff'?'Add team member':section==='bookings'?'New booking':section==='enquiries'?'New enquiry':section==='jobs'?'New project':'Add service',section)}</div>${table(section,columns[section],db[section])}<div class="notice">Indicative rates and staff availability are manually maintained. ₹299 site-visit fee is tracked in enquiry records. KARVO is operated by NEOCRAFT LLP.</div>`;else if(section==='categories')out.innerHTML=categoryPage();else if(section==='reports')out.innerHTML=reports();else out.innerHTML=settingsPage()};checkAdminSession();
</script><style>

.banner{background:linear-gradient(135deg,#0b6b49,#238b68);box-shadow:0 10px 32px rgba(11,107,73,.22)}

th{background:var(--md-surface-container);color:#64766c}td{background:#fff}tr:hover td{background:#fbfdfb}.toolbar{background:#fff;border-radius:24px 24px 0 0}.notice{border-radius:18px;background:#fff8e8;border-color:#ead9a8}
.auth-screen{background:radial-gradient(circle at 20% 0,#d7f4e5 0,#f8fbf8 38%,#eef5f0 100%)}.auth-card{padding:32px}.auth-card input{border-radius:16px}
.avatar{background:var(--md-primary-container);color:var(--md-primary)}
@media(max-width:950px){.app{grid-template-columns:78px 1fr}.sidebar{padding-left:12px;padding-right:12px}.nav{border-radius:18px}}@media(max-width:540px){.work{padding:16px}.topbar{height:auto;min-height:68px}.banner,.panel,.stat,.smallcard{border-radius:20px}}
</style><div style="position:fixed;right:12px;bottom:8px;background:#ffffffde;border:1px solid #dde9e1;border-radius:8px;padding:6px 9px;color:#557266;font:11px Arial;z-index:100">KARVO • Operated by NEOCRAFT LLP</div></body></html>
