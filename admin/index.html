<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARVO Admin | NEOCRAFT LLP</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--green:#087b4b;--dark:#0b2520;--bg:#f4f7f6;--muted:#70817a;--line:#e4ebe7}*{box-sizing:border-box}body{margin:0;font-family:DM Sans,Arial,sans-serif;background:var(--bg);color:#182b25}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:247px 1fr;min-height:100vh}.sidebar{background:#092b21;color:white;padding:26px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-family:Manrope,sans-serif;font-size:28px;letter-spacing:-1.7px;font-weight:800;padding:4px 13px 28px}.brand span{color:#2cdb8c}.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:700;color:#9ec4b1;margin-top:-2px}.slabel{padding:21px 13px 9px;color:#79a492;font-size:10px;font-weight:800;letter-spacing:1.6px}.nav{display:flex;width:100%;padding:12px 13px;gap:12px;align-items:center;background:none;border:none;text-align:left;color:#bfd8ca;border-radius:10px;font-weight:650;margin:2px 0}.nav:hover,.nav.active{background:#185a42;color:white}.nav .ico{font-size:17px;width:22px;text-align:center}.sidefooter{margin-top:34px;border-top:1px solid #205340;padding:18px 12px;color:#9fc4b3;font-size:12px;line-height:1.7}.main{min-width:0}.topbar{height:77px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 31px;border-bottom:1px solid var(--line);gap:12px}.bread{font-size:13px;color:var(--muted)}.bread strong{display:block;font-size:20px;color:var(--dark);margin-top:2px}.avatar{height:36px;width:36px;border-radius:50%;background:#dcf5e7;display:grid;place-items:center;color:#087b4b;font-weight:800}.topright{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.work{max-width:1550px;margin:0 auto;padding:28px 30px 70px}.banner{background:linear-gradient(115deg,#0b553c,#0f8060);border-radius:18px;padding:23px 26px;color:white;display:flex;align-items:center;justify-content:space-between;gap:18px}.banner h2{margin:0 0 7px;font-size:23px}.banner p{margin:0;color:#d3efe0;font-size:13px;line-height:1.5}.chip{font-size:11px;padding:6px 9px;border-radius:6px;background:#e6f5ec;color:#127145;font-weight:800;white-space:nowrap}.chip.amber{background:#fff4db;color:#906000}.chip.blue{background:#e8f1ff;color:#225db0}.chip.gray{background:#edf2ef;color:#5d6d65}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:21px}.stat .num{font-size:30px;font-weight:800;margin:13px 0 4px}.stat .lab{color:#60766c;font-size:12px;font-weight:700}.stat .sub{color:#94a49a;font-size:11px;margin-top:6px}.sectiontop{display:flex;justify-content:space-between;align-items:center;margin:23px 0 13px;gap:12px}.sectiontop h2{font-size:19px;margin:0;letter-spacing:-.5px}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #dbe7df;border-radius:9px;padding:10px 14px;background:white;color:#244336;font-weight:750;font-size:12px}.btn.primary{background:#0b754c;border-color:#0b754c;color:white}.btn:hover{filter:brightness(.96)}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line);gap:9px}.toolbar input,.toolbar select{border:1px solid #dce7df;border-radius:9px;padding:10px 12px;background:#fff;color:#334b3e;min-width:160px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:14px 16px;border-bottom:1px solid #eef2ef;font-size:12px}th{color:#7a8b81;font-weight:800;background:#fcfdfc}td{color:#2c4639}tr:last-child td{border:0}tr:hover td{background:#fcfefd}.strong{font-weight:800}.muted{color:#85978a}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:17px}.paneltitle{padding:20px 20px 6px;font-size:16px;font-weight:800}.activity{padding:12px 20px 20px}.activityitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #edf3ee}.activityitem:last-child{border:0}.dot{height:9px;width:9px;margin-top:5px;background:#15ab70;border-radius:50%;flex-shrink:0}.activityitem b{font-size:12px}.activityitem p{font-size:12px;color:#7b8f81;margin:4px 0}.bar{background:#e9f3ed;height:10px;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:#15aa6a;border-radius:10px}.catline{padding:13px 20px}.catline .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:750}.field input,.field select,.field textarea{border:1px solid #d8e5dc;border-radius:9px;padding:11px;background:white;min-width:0;outline-color:#17a96a}.field.full{grid-column:1/-1}.field textarea{min-height:94px;resize:vertical}.modalwrap{position:fixed;inset:0;background:#071c16a8;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(610px,100%);background:white;box-shadow:0 30px 90px #0003;border-radius:18px;padding:24px;max-height:91vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:20px}.x{border:0;background:#f0f4f1;border-radius:8px;padding:7px 10px;font-size:17px}.modbuttons{display:flex;gap:10px;justify-content:flex-end;margin-top:19px}.empty{padding:38px;text-align:center;color:#73877a}.notice{background:#fffaf0;border:1px solid #f0e5c3;border-radius:10px;padding:13px 17px;color:#7a622a;font-size:12px;margin-top:13px;line-height:1.5}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.smallcard{padding:17px;background:white;border:1px solid var(--line);border-radius:13px}.smallcard h3{margin:8px 0;font-size:14px}.smallcard p{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#102c22;color:white;border-radius:11px;padding:12px 18px;z-index:40;box-shadow:0 8px 30px #0003;font-size:13px}.hint{font-size:12px;color:#789083;line-height:1.6}.hidden{display:none!important}@media(max-width:950px){.app{grid-template-columns:72px 1fr}.brand{font-size:18px;padding:4px 1px 18px}.brand small,.nav .txt,.slabel,.sidefooter{display:none}.sidebar{padding:17px 10px}.nav{justify-content:center;padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.work{padding:20px}.topbar{padding:0 20px}}@media(max-width:540px){.stats,.gridcards,.formgrid{grid-template-columns:1fr}.topright span{display:none}.topbar{height:67px}.work{padding:13px}.banner{padding:18px;display:block}.sectiontop{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch}.toolbar input{width:100%}.field.full{grid-column:auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">KAR<span>VO</span>.<small>ADMIN CONSOLE</small></div><div class="slabel">WORKSPACE</div><div id="menu"></div><div class="sidefooter">KARVO Jaipur Pilot<br><b>Local Demo Mode</b><br>Data stays in this browser.</div></aside><div class="main"><header class="topbar"><div class="bread">KARVO / ADMIN <strong id="heading">Overview</strong></div><div class="topright"><span>Jaipur, Rajasthan</span><span class="chip amber">DEMO • NOT LIVE</span><div class="avatar">K</div></div></header><div class="work" id="view"></div></div></div><div id="portal"></div><script>
const storage='karvo_admin_v1';
const seeds={enquiries:[{id:'ENQ-1001',customer:'Sample Customer A',phone:'',service:'MS Gate Fabrication',location:'Vaishali Nagar',budget:'₹75,000',status:'New',date:'2026-10-08',notes:'Demo enquiry only'},{id:'ENQ-1002',customer:'Sample Customer B',phone:'',service:'Luxury Interiors',location:'Mansarovar',budget:'₹4,00,000',status:'Contacted',date:'2026-10-07',notes:'Demo enquiry only'},{id:'ENQ-1003',customer:'Sample Customer C',phone:'',service:'Site Manager',location:'Malviya Nagar',budget:'₹2,500/day',status:'Quoted',date:'2026-10-06',notes:'Demo enquiry only'}],jobs:[{id:'JOB-201',title:'Residential gate installation',client:'Sample Customer A',category:'Fabrication',status:'Planning',start:'2026-10-12',deadline:'2026-10-18',value:75000,progress:10},{id:'JOB-202',title:'Apartment interior finishing',client:'Sample Customer B',category:'Interiors',status:'In Progress',start:'2026-10-05',deadline:'2026-10-28',value:400000,progress:45}],staff:[{id:'STF-001',name:'Sample Site Manager',role:'Site Manager',skill:'Professional',rate:3000,availability:'Available',phone:'',experience:'5+ years',verified:'No'},{id:'STF-002',name:'Sample Fabricator',role:'Steel Fitter',skill:'Skilled Labour',rate:1200,availability:'Assigned',phone:'',experience:'4+ years',verified:'No'},{id:'STF-003',name:'Sample Interior Designer',role:'Interior Designer',skill:'Professional',rate:4500,availability:'Available',phone:'',experience:'6+ years',verified:'No'}],bookings:[{id:'BK-1001',customer:'Sample Customer C',role:'Site Manager',staff:'Unassigned',date:'2026-10-14',days:7,workers:1,status:'Requested'}],services:[{id:'SVC-01',name:'Modern MS Gate & Installation',category:'Fabrication',price:900,unit:'sq.ft.',enabled:true},{id:'SVC-02',name:'Gypsum False Ceiling',category:'Interiors',price:110,unit:'sq.ft.',enabled:true},{id:'SVC-03',name:'Site Manager',category:'Hire Professionals & Labour',price:3000,unit:'day',enabled:true},{id:'SVC-04',name:'Skilled Welder',category:'Hire Professionals & Labour',price:1200,unit:'day',enabled:true},{id:'SVC-05',name:'Painting',category:'Painting',price:25,unit:'sq.ft.',enabled:true}],categories:['Fabrication','Interiors','Industrial Works','Renovation','Maintenance','Electrical','Plumbing','Painting','Roofing & Cladding','Flooring & Tiles','Glass & Aluminium','Signage & Branding','Carpentry & Furniture','Landscape & Outdoor','Hire Professionals & Labour'],settings:{company:'KARVO',location:'Jaipur, Rajasthan',phone:'+91 91666 91274',email:'karvosite@gmail.com',currency:'INR'}};
function clone(x){return JSON.parse(JSON.stringify(x))}let db;try{db=JSON.parse(localStorage.getItem(storage))||clone(seeds)}catch{db=clone(seeds)}for(const k of Object.keys(seeds))if(!(k in db))db[k]=clone(seeds[k]);
let section='overview',filter='';function save(){localStorage.setItem(storage,JSON.stringify(db))}function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),2400)}const pages=[['overview','▦','Overview'],['enquiries','✉','Enquiries & Leads'],['jobs','▤','Projects & Tasks'],['bookings','▣','Hiring Bookings'],['staff','♙','Team & Labour'],['services','▧','Services & Pricing'],['categories','◫','Categories'],['reports','▥','Reports & Export'],['settings','⚙','Settings']];
function initMenu(){document.getElementById('menu').innerHTML=pages.map(([id,ico,label],i)=>`${i===7?'<div class="slabel">SYSTEM</div>':''}<button class="nav ${section===id?'active':''}" onclick="switchTo('${id}')"><span class="ico">${ico}</span><span class="txt">${label}</span></button>`).join('')};function switchTo(s){section=s;filter='';initMenu();render();window.scrollTo(0,0)}function actions(name,kind){return `<div class="tools"><button class="btn" onclick="exportCSV('${kind}')">↓ Export CSV</button><button class="btn primary" onclick="editRow('${kind}')">+ ${name}</button></div>`}function badge(v){let c=/new|requested|planning|pending/i.test(v)?'amber':/progress|contacted|assigned/i.test(v)?'blue':/completed|won|available|approved/i.test(v)?'':'gray';return `<span class="chip ${c}">${esc(v)}</span>`}function table(kind,cols,rows){return `<div class="panel"><div class="toolbar"><div class="strong" style="font-size:13px">${rows.length} records <span class="muted">• demo data</span></div><input placeholder="Search ${kind}..." value="${esc(filter)}" oninput="filter=this.value;drawTable('${kind}')" id="flt"></div><div class="tablewrap" id="tbl">${tableInner(kind,cols,rows)}</div></div>`}function tableInner(kind,cols,rows){let out=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()));return out.length?`<table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${out.map(r=>`<tr>${cols.map(([k])=>`<td>${k==='status'||k==='availability'?badge(r[k]):k==='price'||k==='rate'||k==='value'||k==='visitFee'?money(r[k]??(k==='visitFee'?299:0)):k==='enabled'?badge(r[k]?'Active':'Hidden'):esc(r[k])}</td>`).join('')}<td><button class="btn" onclick="editRow('${kind}','${r.id}')">Edit</button> <button class="btn" onclick="deleteRow('${kind}','${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No matching records found.</div>`}const fields={enquiries:[['customer','Customer name','text'],['phone','Phone number','tel'],['service','Service required','text'],['location','Site location','text'],['budget','Budget / value','text'],['visitFee','Site visit charge (₹)','number'],['paymentStatus','Payment status','select','Payment Pending|Payment Link Sent|Paid (verified)|Waived|Refunded'],['paymentReference','Gateway transaction reference','text'],['date','Enquiry date','date'],['status','Status','select','New|Contacted|Quoted|Won|Lost'],['notes','Notes','textarea']],jobs:[['title','Project title','text'],['client','Client','text'],['category','Category','text'],['value','Project value (₹)','number'],['progress','Progress (%)','number'],['start','Start date','date'],['deadline','Deadline','date'],['status','Status','select','Planning|In Progress|On Hold|Completed']],bookings:[['customer','Customer','text'],['role','Required role','text'],['staff','Assigned staff','text'],['date','Start date','date'],['workers','Workers','number'],['days','Days','number'],['status','Status','select','Requested|Contacted|Confirmed|In Progress|Completed|Cancelled']],staff:[['name','Full name','text'],['role','Role / profession','text'],['skill','Skill category','select','Professional|Skilled Labour|General Labour'],['rate','Daily client booking rate (₹)','number'],['availability','Availability','select','Available|Assigned|Unavailable'],['experience','Experience','text'],['phone','Contact number','tel'],['verified','Credentials checked?','select','No|Yes']],services:[['name','Service name','text'],['category','Category','text'],['price','Indicative starting rate (₹)','number'],['unit','Unit','select','sq.ft.|sq.m.|day|kg|visit|running ft.|project'],['enabled','Show in catalogue','checkbox']]};
function editRow(kind,id){let row=id?db[kind].find(x=>String(x.id)===id):{},isNew=!id;if(!row)return;let form=fields[kind].map(([key,label,type,opts])=>{let v=row[key]??(kind==='enquiries'&&key==='visitFee'?299:kind==='enquiries'&&key==='paymentStatus'?'Payment Pending':'');return `<label class="field ${key==='notes'?'full':''}">${label}${type==='textarea'?`<textarea name="${key}">${esc(v)}</textarea>`:type==='select'?`<select name="${key}">${opts.split('|').map(x=>`<option ${x===String(v)?'selected':''}>${esc(x)}</option>`).join('')}</select>`:type==='checkbox'?`<input name="${key}" type="checkbox" ${v?'checked':''}>`:`<input name="${key}" type="${type}" value="${esc(v)}" ${['customer','title','name'].includes(key)?'required':''}>`}</label>`}).join('');document.getElementById('portal').innerHTML=`<div class="modalwrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${isNew?'Add':'Edit'} ${kind.slice(0,-1)}</h2><button class="x" onclick="closeModal()">×</button></div><form id="editform" onsubmit="submitRow(event,'${kind}','${id||''}')"><div class="formgrid">${form}</div><div class="modbuttons"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></div>`}
function closeModal(ev){if(ev&&ev.target!==ev.currentTarget)return;document.getElementById('portal').innerHTML=''}function submitRow(event,kind,id){event.preventDefault();let f=event.target;let obj=id?db[kind].find(x=>String(x.id)===id):{id:(kind==='staff'?'STF-':kind==='enquiries'?'ENQ-':kind==='jobs'?'JOB-':kind==='bookings'?'BK-':'SVC-')+Date.now().toString().slice(-7)};for(let [key,label,type] of fields[kind]){let el=f.elements[key];obj[key]=type==='checkbox'?el.checked:type==='number'?Number(el.value):el.value}if(!id){if(kind==='enquiries'){obj.visitFee=299;obj.paymentStatus=obj.paymentStatus||'Payment Pending';}db[kind].unshift(obj);}save();closeModal();render();toast('Saved to local demo data')}function deleteRow(kind,id){if(!confirm('Delete this demo record?'))return;db[kind]=db[kind].filter(x=>String(x.id)!==id);save();render();toast('Record deleted')};function drawTable(kind){let cols=columns[kind];document.getElementById('tbl').innerHTML=tableInner(kind,cols,db[kind])}const columns={enquiries:[['id','ID'],['customer','Customer'],['service','Service'],['location','Location'],['budget','Budget'],['visitFee','Visit fee'],['paymentStatus','Payment'],['status','Stage'],['date','Date']],jobs:[['id','Job ID'],['title','Project'],['client','Client'],['category','Type'],['value','Value'],['progress','Progress %'],['status','Status']],bookings:[['id','Booking ID'],['customer','Customer'],['role','Role'],['staff','Assigned to'],['date','Start'],['days','Days'],['workers','Workers'],['status','Status']],staff:[['name','Team member'],['role','Role'],['skill','Type'],['rate','Booking/day'],['availability','Availability'],['experience','Experience'],['verified','Verified']],services:[['name','Service'],['category','Category'],['price','From'],['unit','Unit'],['enabled','Visibility']]};
function overview(){let pending=db.enquiries.filter(x=>x.status==='New').length, active=db.jobs.filter(x=>x.status==='In Progress').length,booked=db.bookings.filter(x=>x.status==='Requested').length,staff=db.staff.filter(x=>x.availability==='Available').length;return `<div class="banner"><div><h2>Good afternoon 👋</h2><p>Manage KARVO enquiries, projects, team deployments and service pricing from one place.</p></div><span class="chip amber">Sample data only</span></div><div class="stats">${[['New enquiries',pending,'Needs follow-up'],['Active projects',active,'Execution status'],['Hiring requests',booked,'Pending confirmation'],['Available staff',staff,'Demo availability']].map(([lab,num,sub])=>`<div class="stat"><div class="lab">${lab}</div><div class="num">${num}</div><div class="sub">${sub}</div></div>`).join('')}</div><div class="sectiontop"><h2>Operations snapshot</h2><button class="btn primary" onclick="switchTo('enquiries')">Manage enquiries →</button></div><div class="two"><div class="panel"><div class="paneltitle">Latest enquiries</div><div class="tablewrap">${tableInner('enquiries',[['customer','Customer'],['service','Service'],['status','Stage']],db.enquiries.slice(0,5))}</div></div><div class="panel"><div class="paneltitle">Project progress</div>${db.jobs.map(x=>`<div class="catline"><div class="row"><b>${esc(x.title)}</b><span>${x.progress}%</span></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,x.progress))}%"></i></div></div>`).join('')||'<div class="empty">No projects yet</div>'}</div></div><div class="notice">⚠ This is a <b>functional local admin prototype</b>. Entries are sample records, not real customer orders. Updates are stored only in this browser; this dashboard is not yet connected to the KARVO customer website.</div>`}
function categoryPage(){return `<div class="sectiontop"><h2>Service categories</h2><div class="tools"><button class="btn primary" onclick="addCategory()">+ Add category</button></div></div><div class="gridcards">${db.categories.map((c,i)=>`<div class="smallcard"><span class="chip gray">CATEGORY ${i+1}</span><h3>${esc(c)}</h3><p>${db.services.filter(s=>s.category===c).length} managed service entries</p><button class="btn" onclick="renameCategory(${i})">Rename</button> <button class="btn" onclick="removeCategory(${i})">Delete</button></div>`).join('')}</div><div class="notice">Category changes currently affect this admin prototype only. Public website catalogue publishing requires a shared backend or export-to-customer workflow.</div>`}function addCategory(){let v=prompt('Category name');if(!v)return;if(db.categories.some(x=>x.toLowerCase()===v.trim().toLowerCase()))return toast('Category already exists');db.categories.push(v.trim());save();render()}function renameCategory(i){let v=prompt('New category name',db.categories[i]);if(!v)return;let old=db.categories[i];db.categories[i]=v.trim();db.services.forEach(x=>{if(x.category===old)x.category=v.trim()});save();render()}function removeCategory(i){if(!confirm('Remove this category from admin?'))return;db.categories.splice(i,1);save();render()}
function reports(){return `<div class="sectiontop"><h2>Reports, backup & restore</h2></div><div class="gridcards">${[['Enquiries','enquiries'],['Projects','jobs'],['Hiring bookings','bookings'],['Team directory','staff'],['Service price list','services']].map(([name,id])=>`<div class="smallcard"><span class="chip">CSV EXPORT</span><h3>${name}</h3><p>${db[id].length} records</p><button class="btn primary" onclick="exportCSV('${id}')">Download CSV</button></div>`).join('')}</div><div class="panel" style="margin-top:18px;padding:20px"><h3>Full data backup</h3><p class="hint">Download a JSON backup of your admin records, or restore a previous backup. Nothing is sent to a server.</p><div class="tools"><button class="btn primary" onclick="exportJSON()">Download JSON backup</button><label class="btn">Import JSON backup <input class="hidden" type="file" accept=".json,application/json" onchange="importJSON(event)"></label><button class="btn" onclick="resetData()">Reset demo records</button></div></div>`}function exportCSV(kind){let a=db[kind],keys=[...new Set(a.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...a.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download(kind+'.csv',csv,'text/csv;charset=utf-8')}function download(name,contents,type){let blob=new Blob(['\ufeff',contents],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportJSON(){download('karvo-admin-backup.json',JSON.stringify(db,null,2),'application/json')}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.enquiries)||!Array.isArray(obj.staff)||!Array.isArray(obj.services))throw Error('Unrecognized backup file');if(!confirm('Replace current admin demo data with imported backup?'))return;db=obj;save();render();toast('Backup restored')}catch(err){alert('Could not import backup: '+err.message)}}function resetData(){if(!confirm('Reset all locally edited admin records to sample data?'))return;db=clone(seeds);save();render();toast('Demo data reset')}
function settingsPage(){return `<div class="sectiontop"><h2>Business settings</h2></div><div class="panel" style="padding:23px;max-width:760px"><form onsubmit="saveSettings(event)"><div class="formgrid">${[['company','Company name'],['location','Primary service city'],['phone','Business phone'],['email','Business email']].map(([k,l])=>`<label class="field">${l}<input name="${k}" value="${esc(db.settings[k])}"></label>`).join('')}</div><div style="margin-top:18px"><button class="btn primary">Save settings</button></div></form></div><div class="notice"><b>Site visit policy:</b> ₹299 mandatory per visit request. Admin can mark payment paid only after external transaction verification. No gateway is connected in this demo.</div><div class="notice">Production launch needs authenticated admin accounts, access roles, encrypted customer records, central data storage and a real booking API. Do not treat this local demo as secure business software.</div>`}function saveSettings(e){e.preventDefault();for(let k of ['company','location','phone','email'])db.settings[k]=e.target.elements[k].value;save();toast('Settings saved locally')}
function render(){document.getElementById('heading').textContent=pages.find(x=>x[0]===section)?.[2]||'Overview';const out=document.getElementById('view');if(section==='overview')out.innerHTML=overview();else if(columns[section])out.innerHTML=`<div class="sectiontop"><h2>${pages.find(x=>x[0]===section)[2]}</h2>${actions(section==='staff'?'Add team member':section==='bookings'?'New booking':section==='enquiries'?'New enquiry':section==='jobs'?'New project':'Add service',section)}</div>${table(section,columns[section],db[section])}<div class="notice">Indicative rates and staff availability are manually maintained. ₹299 site-visit fee is tracked in enquiry records. No payment gateway or customer sync is connected. KARVO is operated by NEOCRAFT LLP.</div>`;else if(section==='categories')out.innerHTML=categoryPage();else if(section==='reports')out.innerHTML=reports();else out.innerHTML=settingsPage()};initMenu();render();
